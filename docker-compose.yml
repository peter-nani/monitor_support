version: "3.9"

services:

  monitor_support:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: monitor_support

    env_file:
      - .env

    volumes:
        - ./.auth:/home/hr306/monitor_support/.auth
        - ./output:/home/hr306/monitor_support/output
        - ./state.json:/home/hr306/monitor_support/state.json
        - /tmp:/tmp
    working_dir: /home/hr306/monitor_support
    restart: unless-stopped
